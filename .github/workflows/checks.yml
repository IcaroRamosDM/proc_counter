name: Checks
"on":
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  module:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check C formatting
        run: |
          python3 -m venv "$RUNNER_TEMP/style"
          "$RUNNER_TEMP/style/bin/pip" install clang-format==23.1.3
          git ls-files -z '*.c' '*.h' | xargs -0 -r "$RUNNER_TEMP/style/bin/clang-format" --dry-run --Werror --
      - name: Install kernel headers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential linux-headers-generic
      - name: Compile without loading the module
        run: |
          headers=$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -n 1)
          test -n "$headers"
          make -j2 KDIR="$headers"
      - name: Check integration script syntax
        run: python3 -m compileall -q tests
